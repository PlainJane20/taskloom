[package]
name = "taskloom"
version = "0.6.0"
description = "Local-first visual agent orchestrator"
authors = ["Taskloom contributors"]
edition = "2021"

[lib]
name = "taskloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
